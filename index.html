<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Loyalty Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-amber-200">
        <h1 class="text-2xl font-bold text-amber-900 mb-1">☕ Cafe Loyalty Card</h1>
        <p class="text-xs text-amber-700 mb-6">Collect 7 stamps to get 1 Free Cappuccino!</p>
        
        <!-- Stamps Grid (7 Visits) -->
        <div class="grid grid-cols-4 gap-3 mb-6">
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-400 bg-amber-100 flex items-center justify-center text-xl font-bold text-amber-800">☕ 1</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">2</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">3</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">4</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">5</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">6</div>
            <div class="h-14 w-14 rounded-full border-2 border-dashed border-amber-300 bg-amber-50 flex items-center justify-center text-xs text-amber-400">7</div>
            <div class="h-14 w-14 rounded-full border-2 border-amber-500 bg-amber-500 text-white flex items-center justify-center text-xl shadow-md">🎁</div>
        </div>

        <button class="w-full bg-amber-800 hover:bg-amber-900 text-white font-semibold py-3 rounded-xl transition-all shadow-lg">
            Add Visit Stamp
        </button>
    </div>
</body>
</html>
